# Coding dictionary
#
# The words this backlog uses for the practice of software engineering, one meaning each. Agents
# and people use these terms in stories, features, docs, code comments, commits and replies.
# A project's business domain has its own dictionary, which backlog.json may list beside this one.
#
# bl init copied this file from bl's seed, templates/coding-dictionary.yaml. The copy is the
# project's own: curate it here. A later change to bl's seed does not reach this copy.
#
# Limit: this dictionary shapes the words agents write in prose. It does not rename bl's CLI
# verbs, frontmatter keys or section headings (`bl validate`, `review_rounds_max`, `## Review Log`).
#
# Each entry:
#   term     the word to use
#   meaning  what it means, in one or two plain sentences
#   avoid    words not to use for this meaning (they may still be right for another meaning)
#   decided  where the term was set: a doc, a feature or a decision
#
# A word that also has a domain meaning is qualified so that it never means two things in one
# text: "work unit" here, never a bare "unit".

entries:
  # --- Planning: the value axis and the code axis ----------------------------------------------

  - term: theme
    meaning: >-
      A value area that never finishes, such as a product area or the tooling. Each feature names
      one, and the theme's brief lists what an agent reads before working in it.
    avoid: [project, area, product line]
    decided: bl src/AGENTS.md, "Themes and Epics"

  - term: epic
    meaning: >-
      An outcome under one theme that finishes once every feature under it is done. A feature
      may name one; an epic stores no list of its features.
    avoid: [initiative, milestone, component]
    decided: bl src/AGENTS.md, "Themes and Epics"

  - term: feature
    meaning: >-
      One use case with its exceptional paths, and the work unit bl runs: one branch, one pull
      request per repo, one review and one merge over an ordered set of stories.
    avoid: [project, change set, epic]
    decided: bl src/AGENTS.md, "Features"

  - term: story
    meaning: >-
      One step of a feature, or a standalone chore, bug or update. It names exactly one
      component, and the component's repo is the story's repo.
    avoid: [ticket, issue, task, item]
    decided: bl src/AGENTS.md, "Story Frontmatter" and "Lifecycle of a Story"

  - term: component
    meaning: >-
      A code boundary in one repo: a label with no status, points or completion. Every story
      names one.
    avoid: [epic, module, area]
    decided: bl src/AGENTS.md, "Component Frontmatter"

  - term: work unit
    meaning: >-
      A feature, a story batch or a loose story: the thing bl runs, reviews and merges. In prose
      always write "work unit", never a bare "unit". Code identifiers such as `unitKind` stay as
      they are.
    avoid: [unit, item, ticket, job]
    decided: bl src/AGENTS.md, "Priority" (units) and "Features" (the execution unit); F-125 A1

  - term: story batch
    meaning: >-
      A work unit that bundles refined stories by theme or component, each refined on its own.
      `bl batch` builds it already approved; its id is `B-<n>`. It runs like a feature: one
      branch, one pull request per repo, one review and one merge.
    avoid: [bundle, group, set, feature]
    decided: bl src/AGENTS.md, "Story batches" (F-125 Design 1, Decision A4)

  - term: execution plan
    meaning: >-
      What `bl run` computes from a work unit's stories at run start and stores as `plan.yaml`:
      the dependencies between the stories, the work order, the parallel groups and the repo and
      merge order. During the run the stored plan wins over a new computation.
    avoid: [schedule, run plan, implementation plan]
    decided: bl src/AGENTS.md, "The execution plan" (F-125 Design 2)

  # --- People and sessions ---------------------------------------------------------------------

  - term: operator
    meaning: >-
      The person who runs bl and decides: approves features, ranks the priority, does the tasks,
      answers escalations and merges.
    avoid: [user, human, owner]
    decided: bl src/AGENTS.md, "Escalations for the operator"

  - term: session
    meaning: >-
      One agent session: one run of an agent CLI on one prompt, interactive or headless. A run is
      made of many sessions (implement, fix-tests, self-review, review passes, fix).
    avoid: [conversation, chat, job]
    decided: bl src/AGENTS.md, "Headless sessions"

  - term: run
    meaning: >-
      `bl run`, the loop that takes a work unit from approved to reviewed: it implements each
      story, runs the test gate, self-reviews, opens the pull requests and repeats review rounds
      and fixes until the review is addressed or the work unit is escalated.
    avoid: [pipeline, job, build]
    decided: bl src/AGENTS.md, "Features" (Lifecycle) and "`bl run` for a story"

  # --- Code and change ---------------------------------------------------------------------------

  - term: branch
    meaning: >-
      The git branch that a work unit's changes go on, one per work unit, named from its id and
      title. Every repo of the work unit uses the same branch name.
    avoid: [topic, stream]
    decided: bl src/AGENTS.md, "Features" (Lifecycle)

  - term: worktree
    meaning: >-
      A git worktree of one repo on a work unit's branch, at `<root>/<branch>/<repo>`. The work
      unit's directory, `<root>/<branch>`, holds one worktree per repo of the work unit.
    avoid: [clone, copy, sandbox]
    decided: >-
      bl src/AGENTS.md, "`backlog.json` `worktrees`: the worktree root"

  - term: pull request
    meaning: >-
      The forge's review request for one repo's branch. `bl run` opens one per repo that has
      commits, with its body from the change document, and `bl merge` closes it. "PR" is fine.
    avoid: [merge request, MR, diff]
    decided: bl src/AGENTS.md, "Forge ops"

  - term: change document
    meaning: >-
      The file `change.md` beside a work unit's `index.md`: the record of its change, with each
      repo's branch and pull request, the review state, and the Gate, Review Log and Merge
      sections. `index.md` is the plan; the change document is what happened.
    avoid: [document, change log, changelog, PR description]
    decided: bl src/AGENTS.md, "The change document"

  - term: deferred
    meaning: >-
      Follow-up code work of 8 points or more that a session found and did not do, one bullet
      each under a work unit's `## Deferred` heading, starting with `[points: N]`. Smaller work
      is done in the session.
    avoid: [to do, todo, follow-up, later]
    decided: bl src/AGENTS.md, "`## Deferred`, `## Notes` and tasks"

  # --- Statuses: one word for each state (F-69 A3) ----------------------------------------------
  #
  # Stories, features, tasks and epics use the ten work unit statuses; each type uses the subset
  # `flow.json` gives it. A change document has its own three: `open`, `merged` and `dropped`.

  - term: draft
    meaning: >-
      A work unit that is written and not yet refined: the first status of a story, a feature
      and a task. An epic is draft while it has no features or only draft ones.
    avoid: [backlog (as a status), open (for a work unit), new, todo]
    decided: F-69 Decision A3

  - term: refined
    meaning: >-
      A story or feature whose design and plan are written (`bl refine`). A refined story can
      run; a refined feature waits for the operator's approval.
    avoid: [ready, groomed, planned]
    decided: F-69 Decision A3

  - term: approved
    meaning: >-
      A feature the operator approved to run (`bl approve`). Only a feature has this status.
    avoid: [accepted, signed off]
    decided: F-69 Decision A3

  - term: in_progress
    meaning: >-
      A work unit whose work has started: a session or a run works on it on its branch. An epic
      is in_progress while some feature is past draft and not every one is done.
    avoid: [running, active, started, WIP]
    decided: F-69 Decision A3

  - term: in_review
    meaning: >-
      A work unit whose change is in a review round, or waits for the next one after a fix.
    avoid: [reviewing, under review]
    decided: F-69 Decision A3

  - term: fixing
    meaning: >-
      A work unit whose latest review left open items, which a fix session works on.
    avoid: [rework, changes requested]
    decided: F-69 Decision A3

  - term: ready_for_merge
    meaning: >-
      A work unit whose latest review is clean, so `bl merge` may land it.
    avoid: [mergeable, approved (for a review)]
    decided: F-69 Decision A3

  - term: escalated
    meaning: >-
      A work unit stopped until the operator decides: its `## Escalation` section holds the
      question.
    avoid: [blocked, stuck, failed]
    decided: F-69 Decision A3

  - term: done
    meaning: >-
      A work unit that is finished: merged, or closed by `bl done`. A task is done when the
      operator closes it. An epic is done when every feature under it is done.
    avoid: [closed (for a work unit), complete, finished, merged (for a work unit)]
    decided: F-69 Decision A3

  - term: superseded
    meaning: >-
      A work unit replaced by another or dropped without being done. `superseded_by:` names the
      replacement, when there is one.
    avoid: [dropped (for a work unit), cancelled, obsolete, won't fix]
    decided: F-69 Decision A3

  - term: open
    meaning: >-
      A change document whose change is live: not yet merged or dropped. bl works on a work
      unit's highest-numbered open change document. A work unit is never open.
    avoid: [active, pending]
    decided: F-69 Decision A3

  - term: merged
    meaning: >-
      A change document whose branches `bl merge` landed on `main`.
    avoid: [landed, closed]
    decided: F-69 Decision A3

  - term: dropped
    meaning: >-
      A change document whose change was closed without a merge. bl reads the old word `closed`
      as dropped.
    avoid: [closed (for a change document), abandoned, cancelled]
    decided: F-69 Decision A3

  # --- Control: gates, holds and escalations -----------------------------------------------------

  - term: gate
    meaning: >-
      A point where bl stops a work unit until a condition is met: a status that a hold keeps
      the work unit out of (F-119 D4; the old names `run` and `merge` read as `in_progress` and
      `done`), the test gate before review, and the operator's approve gate.
    avoid: [checkpoint, barrier]
    decided: bl src/AGENTS.md, "Holds between units" and "The test gate"; F-119 D4

  - term: hold
    meaning: >-
      One edge in `blockers.json`: a work unit kept out of a status (the edge's gate) until
      another work unit's status meets a given status, whatever verb would make the move.
      `blockers.json` is the one place for holds and for order: a merge edge or an order edge
      orders two parts of one feature and holds no verb.
    avoid: [lock, freeze, wait]
    decided: bl src/AGENTS.md, "Holds between units"; F-111 D1; F-119 D4

  - term: merge edge
    meaning: >-
      An edge in `blockers.json` between two repos of one feature
      (`F-96:ci-cd` blocks `F-96:bl`): `bl merge` merges the blocker repo first.
    avoid: [merge dependency, repo dependency]
    decided: F-111 D1

  - term: order edge
    meaning: >-
      An edge in `blockers.json` between two stories of one feature: the implement loop
      implements the blocker story first. It replaces `depends_on:` inside a feature.
    avoid: [story dependency, depends_on (inside a feature)]
    decided: F-111 D1

  - term: escalation
    meaning: >-
      A feature's `## Escalation` section, written when the agents cannot go on: the rule at
      stake, the problem, and lettered options for the operator. Anything but `None.` stops
      approve, run and merge.
    avoid: [blocker, ticket, alert]
    decided: bl src/AGENTS.md, "Escalations for the operator"

  # --- Review ------------------------------------------------------------------------------------

  - term: round
    meaning: >-
      One review of a work unit's change: the passes, then the verifier, which writes one Review
      Log session. A work unit's round is the number of entries into `in_review` in its
      transition log (F-69), less a return to a round with no verdict yet; `review_rounds_max`
      caps them. Before F-69 the change document's `review_round` counted them.
    avoid: [iteration, cycle]
    decided: bl src/AGENTS.md, "Review Cycle"

  - term: pass
    meaning: >-
      One review agent's look at a change along one dimension, such as correctness or failure
      paths, that writes a findings file for the verifier. A round has several passes.
    avoid: [sweep, scan]
    decided: bl src/AGENTS.md, "Features" (Lifecycle, `bl review`)

  # --- Verbs -------------------------------------------------------------------------------------

  - term: check
    meaning: >-
      The one verb for finding out whether something is correct: run a test, read a value,
      compare a result. Write "check" for all of these.
    avoid: [verify, confirm, validate, ensure]
    decided: bl src/AGENTS.md, "`bl validate`" (bl's checks)
